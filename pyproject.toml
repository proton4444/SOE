[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soe"
version = "1.1.0a0"
description = "SOE - a deterministic PBEM engine for a fantasy strategy game"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "SOE Engine Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "bandit>=1.7",
    "mypy>=1.11",
    "ruff>=0.6",
    "build>=1.2",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

# Build-time only: regenerating the world map from the gamemaster's
# gazetteer and raster. Not needed to run the engine.
map = [
    "numpy>=1.26",
    "pillow>=10.0",
    "scipy>=1.11",
    "scikit-image>=0.22",
]

[project.scripts]
soe = "cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
# The lint gate is pass/fail, unlike the mypy count gate: `ruff check` is
# clean and stays clean. Pinned here so a contributor's ruff and CI's agree.
target-version = "py311"
exclude = ["build", "dist", ".venv", "venv", "reference", "trailer"]

[tool.mypy]
# Ignore generated build artifacts so `mypy .` is reproducible from a checkout.
exclude = '(^|/)(build|dist|\.venv|venv)/'

# The baseline gate measures `mypy soe webapp cli.py`. `webapp.training` hands a
# run to `scripts.arena`, and following that import would drag the whole
# operator-tooling tree into a count that does not claim to cover it. Skipped
# when reached as an import; still checked when named on the command line.
[[tool.mypy.overrides]]
module = "scripts.*"
follow_imports = "skip"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["soe*"]
